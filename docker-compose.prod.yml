# Despliegue en Coolify (build pack "Docker Compose").
# Solo el servicio "web" necesita dominio público; el API queda en la red interna
# y el navegador lo alcanza vía /api/* a través de la web.
# Los secretos los genera Coolify (variables mágicas SERVICE_PASSWORD_*) y quedan
# guardados en Coolify: no hace falta escribirlos a mano.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_GOOGLE_ENABLED: ${NEXT_PUBLIC_GOOGLE_ENABLED:-false}
    environment:
      SERVICE_FQDN_WEB_3100: ""
      # Correo que aparece en /privacidad y /eliminacion-de-datos (opcional).
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
    depends_on: [api]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://chatea_app:${SERVICE_PASSWORD_APPDB}@postgres:5432/chatea
      MIGRATION_DATABASE_URL: postgres://chatea:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/chatea
      REDIS_URL: redis://redis:6379
      # ¡No cambiar después del primer despliegue! Cifra las API keys y tokens guardados.
      ENCRYPTION_KEY: ${SERVICE_PASSWORD_64_ENCRYPTION}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_BETTERAUTH}
      WEB_URL: ${SERVICE_URL_WEB}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Chatea <no-reply@example.com>}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v27.0}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      retries: 5
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    environment:
      POSTGRES_USER: chatea
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: chatea
      APP_DB_PASSWORD: ${SERVICE_PASSWORD_APPDB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatea"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
