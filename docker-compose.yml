services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: chatea
      POSTGRES_PASSWORD: chatea
      POSTGRES_DB: chatea
      APP_DB_PASSWORD: chatea_app
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatea"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
